# Managed by setup-ubuntu-virtualization (secrets inside — root only).
Server:
  GatewayAddress: @GATEWAY_HOST@
  Port: @GATEWAY_PORT@
  # TLS from Caddy to rdpgw as well, with rdpgw's own certificate for
  # 127.0.0.1 (Caddy trusts exactly that one): rdpgw refuses Basic logins
  # without TLS of its own. Only Caddy reaches it.
  Tls: auto
  CertFile: /run/credentials/rdpgw.service/rdpgw-tls.crt
  KeyFile: /run/credentials/rdpgw.service/rdpgw-tls.key
  # Each client picks what it speaks: mstsc NTLM, the Windows App on macOS,
  # iOS and Android Basic ("local", checked by rdpgw-auth through PAM).
  Authentication:
    - ntlm
    - local
  AuthSocket: /run/rdpgw/auth.sock
  # Clients name the target themselves; only these are allowed.
  HostSelection: unsigned
  Hosts:
@GATEWAY_HOSTS@
  SessionStore: cookie
  SessionKey: @SESSION_KEY@
  SessionEncryptionKey: @SESSION_ENC_KEY@
Caps:
  TokenAuth: false
  RedirectAll: true
  IdleTimeout: 0
Security:
  PAATokenSigningKey: @PAA_SIGN_KEY@
  PAATokenEncryptionKey: @PAA_ENC_KEY@
  # Behind the proxy every client appears as 127.0.0.1.
  VerifyClientIp: false
