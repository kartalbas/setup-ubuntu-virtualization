# Managed by setup-ubuntu-virtualization: accounts the stack runs as.
# libvirt: may use the libvirt sockets. libvirt-qemu: runs the guests (group
# kvm for /dev/kvm, render for the GPU that draws the guests' desktops).
# libvirtdbus: libvirt-dbus (Cockpit's view of libvirt); D-Bus resolves its
# name when loading the bus policy, so it must exist statically.
g libvirt       -
g kvm           -
g render        -
u libvirt-qemu  -   "libvirt QEMU guests"   /var/lib/libvirt
m libvirt-qemu  kvm
m libvirt-qemu  render
u libvirtdbus   -   "libvirt D-Bus bridge"  -
m libvirtdbus   libvirt
