# Pinned tools beside the virtualization stack: not part of it, so a new
# version here never makes the stack look outdated (stack_id hashes only
# versions.conf). Bump a version: change NAME_VERSION, NAME_URL and NAME_SHA256
# together; the download is refused unless the SHA-256 matches.

# lego: the ACME client for the VMs' RDP certificates (modules/65-certs.sh).
LEGO_VERSION="5.5.2"
LEGO_URL="https://github.com/go-acme/lego/releases/download/v5.5.2/lego_v5.5.2_linux_amd64.tar.gz"
LEGO_SHA256="2a35505089e7772c92e1e9ac144df91151ef2eca8568630db0ff91fca06d9bef"
