# setup-ubuntu-virtualization — machine configuration.
#
# `sudo ./setup.sh init` copies this file to
#   /etc/setup-ubuntu-virtualization/config.conf   (root-only, mode 0600)
# Edit it there; every setup.sh command reads it. KEY="value" lines only.

# ---- Host --------------------------------------------------------------------
# This machine's host name (hostnamectl, /etc/hosts); empty = leave it as is.
HOST_NAME=""

# ---- Storage ----------------------------------------------------------------
# Everything lives here: the built stack, sources, VM disks, cloud images and
# libvirt's state (/var/lib/libvirt is bind-mounted from DATA_DIR/libvirt).
# Must be on a mounted data disk.
DATA_DIR="/mnt/data/virt"

# ---- Public entry point: Caddy on TCP 443 -----------------------------------
# Certificates come from Let's Encrypt via TLS-ALPN-01 on port 443, so only
# 443 has to be forwarded from the router. Every host name below needs a DNS
# record pointing at this machine's public address. ACME_EMAIL (optional)
# receives Let's Encrypt's notices.
ACME_EMAIL=""
# Cockpit web console (VM management).
COCKPIT_HOST="vm.example.com"
# RD Gateway: RDP clients use this as "gateway", the VM name as "computer".
GATEWAY_HOST="rdp.example.com"
# More reverse-proxy sites, space separated HOST=UPSTREAM pairs, e.g. a local
# LLM server: "llm.example.com=127.0.0.1:8080". Responses are streamed.
PROXY_SITES=""
# Another machine of yours is the entry point for this one: its LAN address,
# e.g. "192.168.1.250". This host then runs no Caddy and no RD Gateway; its
# Cockpit listens on the LAN for that machine alone, which publishes it as
# one of its PROXY_SITES (COCKPIT_HOST=THIS-HOST:9090) and lets RDP through
# to this host's VMs (its REMOTE_VMS). COCKPIT_HOST and GATEWAY_HOST here are
# the names that machine serves. Empty = this machine is the entry point.
ENTRY_HOST=""
# The entry point only: VMs of other hosts (whose ENTRY_HOST is this machine)
# that the RD Gateway lets through as well, NAME=ADDRESS pairs, e.g.
# "desk3=192.168.1.201".
REMOTE_VMS=""
# Public certificates for the VMs' RDP: every VM of VMS presents a Let's
# Encrypt certificate for VM.RDP_CERT_DOMAIN, the name to enter as "computer"
# (e.g. "host.example.com": desk1.host.example.com). Obtained by the DNS-01
# challenge at Cloudflare, renewed daily; the API token (DNS edit for the zone)
# goes into secrets/cloudflare-dns.token. Empty = the VMs' own self-signed ones.
RDP_CERT_DOMAIN=""

# ---- Firewall (ufw) ---------------------------------------------------------
# 1 = ufw as below; 0 = leave this host's packet filter alone (e.g. on a
# Kubernetes node, whose network plugin owns it).
FIREWALL="1"
# Open to everyone: SSH and 443. LAN_PORTS (TCP) are additionally open to
# the networks in LAN_CIDRS (space separated) and to the VM network, e.g.
# "8080" for a local LLM server that other machines use directly.
LAN_CIDRS="192.168.1.0/24"
LAN_PORTS=""

# ---- VM network (libvirt NAT) -----------------------------------------------
# VMs get fixed addresses NAT_PREFIX.11, .12, ... in the order of VMS below;
# the host is NAT_PREFIX.1. The host's own network is never modified.
NAT_NAME="vmnat"
NAT_BRIDGE="virbr-vm"
NAT_PREFIX="10.77.0"
# Or the VMs straight on the host's LAN (macvtap), each with an address of its
# own there: the LAN interface (e.g. "enp1s0") and one free address per VM in
# the order of VMS (e.g. "192.168.1.201"); prefix, gateway and DNS are the
# host's own on that interface. The host's network stays as it is and no NAT
# network is made; the host itself cannot reach these VMs over the network
# (macvtap), so its checks go through the guest agent. Empty = NAT network.
VM_LAN=""
VM_LAN_ADDRESSES=""

# ---- CPU split --------------------------------------------------------------
# Host CPUs (numbers as in `lscpu -e`) kept free of VM vCPUs: QEMU's I/O
# threads, the proxy, the gateway and host services run there; all other CPUs
# are shared by every VM's vCPUs. Example for 16 cores / 32 threads where
# CPU n and n+16 are siblings: two cores = "0,1,16,17". Empty = no split:
# vCPUs and host share all CPUs.
HOST_CPUS="0,1,16,17"

# ---- Desktop VMs ------------------------------------------------------------
# Names of the VMs (also their host names), in address order.
VMS="desk1 desk2"
# Per-VM resources. RAM is reserved and locked for the VM (never ballooned or
# swapped); vCPUs float over all CPUs not in HOST_CPUS; the disk is thin.
VM_VCPUS="8"
VM_RAM_GIB="16"
VM_DISK_GB="128"
# Swap file in each VM, in GB (0 = none): Ubuntu's installer always makes one,
# the cloud image has none, and without swap a full memory makes the kernel
# end programs. cloud-init makes /swap.img at the first boot.
VM_SWAP_GB="16"
# Login user created in every VM. Its password is generated once and kept in
# /etc/setup-ubuntu-virtualization/secrets/vm-user.password; it is also the
# RDP and RD Gateway password.
VM_USER="vmadmin"
# Guest locale, keyboard layout (+ optional variant) and time zone.
VM_LOCALE="en_US.UTF-8"
VM_KEYBOARD="us"
VM_KEYBOARD_VARIANT=""
VM_TIMEZONE="Etc/UTC"
# GPU that renders the VMs' desktops (virtio-gpu 3D): the stable by-path name
# of its render node, e.g. an integrated GPU the host does not need. Empty =
# no 3D acceleration.
VM_RENDER_NODE="/dev/dri/by-path/pci-0000:05:00.0-render"
# 3D mode: "virgl" (OpenGL) or "venus" (OpenGL + Vulkan). Venus runs a render
# server process next to QEMU, so it turns QEMU's seccomp sandbox off (all VMs).
VM_GPU_MODE="virgl"
# Running VMs when the host shuts down: "suspend" saves them to disk and
# resumes them 1:1 at boot (open programs stay open) — only without 3D
# (VM_RENDER_NODE empty), which QEMU cannot save; "shutdown" shuts them down
# cleanly and boots them again.
VM_HOST_SHUTDOWN="shutdown"
# Ubuntu cloud image the VMs are built from (verified against the SHA256SUMS
# next to it) and the desktop meta package installed on top.
VM_IMAGE_URL="https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img"
VM_DESKTOP_PACKAGE="ubuntu-desktop"

# ---- Your own config repository ----------------------------------------------
# A private repository of yours (OWNER/NAME) that keeps this host's settings —
# this file and the VM password — as they are: sudo ./setup.sh configs [save].
# They live in setup-ubuntu-virtualization/hosts/CONFIGS_HOST/ there; empty
# CONFIGS_HOST = this machine's short host name (set it when hosts share one).
CONFIGS_REPO=""
CONFIGS_HOST=""
